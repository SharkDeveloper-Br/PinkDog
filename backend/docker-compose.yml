version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pinkdog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pinkdog
      POSTGRES_PASSWORD: pinkdog123
      POSTGRES_DB: pinkdog_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
